name: Add diGITrail project icon

on:
  push:
    branches: [feature/ai-distribution]
    paths:
      - .github/workflows/add-project-icon.yml

permissions:
  contents: write

jobs:
  add-project-icon:
    if: github.repository == '0biguan/diGITrail' && github.ref == 'refs/heads/feature/ai-distribution'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      ICON_BLOB_SHA: b9ea06ecd607df6a9c39c77c41823f07f00465d9
      ICON_SEED_SHA256: dadcbdab30dbf82514021d068d522ed05c56027d5a4270635500959f7f32b742
    steps:
      - name: Checkout experimental branch
        uses: actions/checkout@v4
        with:
          ref: feature/ai-distribution
          persist-credentials: true

      - name: Fetch verified temporary icon Git blob
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api "repos/${GITHUB_REPOSITORY}/git/blobs/${ICON_BLOB_SHA}" --jq '.content' | base64 --decode > "${RUNNER_TEMP}/digitrail-icon-seed.webp"
          printf '%s  %s\n' "${ICON_SEED_SHA256}" "${RUNNER_TEMP}/digitrail-icon-seed.webp" | sha256sum --check --status
          test -s "${RUNNER_TEMP}/digitrail-icon-seed.webp"

      - name: Render committed PNG from the approved icon
        run: |
          python3 -m pip install --disable-pip-version-check pillow
          python3 - <<'PY'
          from pathlib import Path
          import os
          from PIL import Image

          source = Path(os.environ["RUNNER_TEMP"]) / "digitrail-icon-seed.webp"
          target = Path("docs/images/digitrail-icon.png")
          with Image.open(source) as icon:
              assert icon.size == (256, 256), icon.size
              assert icon.format == "WEBP", icon.format
              icon.convert("RGB").save(target, format="PNG", optimize=True)
          with Image.open(target) as icon:
              assert icon.size == (256, 256)
              assert icon.format == "PNG"
          print(f"Verified diGITrail icon: {target} ({target.stat().st_size} bytes)")
          PY

      - name: Add icon to README without changing the renderer
        run: |
          python3 - <<'PY'
          from pathlib import Path
          file = Path("README.md")
          text = file.read_text(encoding="utf-8")
          header = "# diGITrail\n"
          icon = (
              '<p align="center">\n'
              '  <img src="docs/images/digitrail-icon.png" width="128" height="128" '
              'alt="diGITrail logo: colourful Git branches and commit nodes" />\n'
              '</p>\n'
          )
          assert text.startswith(header)
          if "docs/images/digitrail-icon.png" not in text:
              text = text.replace(header, header + "\n" + icon, 1)
              file.write_text(text, encoding="utf-8")
          assert text.count('src="docs/images/digitrail-icon.png"') == 1
          print("README header updated to display the project icon")
          PY

      - name: Commit icon and README on experimental branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- docs/images/digitrail-icon.png README.md
          if git diff --cached --quiet; then
            echo "Project icon is already committed; nothing to do."
          else
            git commit -m "docs: add diGITrail project icon to README"
            git push origin HEAD:refs/heads/feature/ai-distribution
          fi
