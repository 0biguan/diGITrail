name: Feature request
description: Suggest an improvement to diGITrail.
title: "[Feature]: "
body:
  - type: textarea
    id: problem
    attributes:
      label: What would you like to do?
      description: Explain the use case or difficulty you are trying to address.
    validations:
      required: true
  - type: textarea
    id: suggestion
    attributes:
      label: Proposed improvement
      description: Describe the behavior you would find useful and any alternatives you have considered.
    validations:
      required: true
