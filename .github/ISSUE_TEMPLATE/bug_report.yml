name: Bug report
description: Report an incorrect graph, CLI error or interface problem.
title: "[Bug]: "
body:
  - type: markdown
    attributes:
      value: Use fictional or public sample data. Remove private repository names, paths, messages, origin URLs and credentials from reports and images.
  - type: textarea
    id: reproduction
    attributes:
      label: Steps to reproduce
      description: Include the command and a minimal example when possible.
      placeholder: "1. Generate a report from examples/demo.json\n2. Open the report\n3. ..."
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
      description: Include the error message or a reviewed image if helpful.
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Environment
      description: Operating system, Python version, Git version and browser.
